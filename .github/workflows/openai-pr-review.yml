name: OpenAI PR Review

# Automated code review for Point Goddess CC business & marketing platform
# Focused on clean, documented JavaScript / TypeScript, security, accessibility, and conversion-friendly patterns.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

# Cancel outdated runs when new commits are pushed to the same PR
concurrency:
  group: openai-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # required to post review comments

jobs:
  openai-review:
    name: OpenAI Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for accurate diff

      - name: Get changed files (JS/TS focus)
        id: changes
        run: |
          # Collect only relevant source files for review
          CHANGED=$(git diff --name-only --diff-filter=ACMRT ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} \
            | grep -E '\.(ts|tsx|js|jsx|mjs|cjs)$' || true)

          if [ -z "$CHANGED" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No JavaScript/TypeScript files changed. Skipping OpenAI review."
            exit 0
          fi

          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "$CHANGED" > changed_files.txt
          echo "Changed files:"
          cat changed_files.txt

      - name: Build review prompt and call OpenAI
        if: steps.changes.outputs.has_changes == 'true'
        id: review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY secret is missing. Please add it in repository Settings → Secrets."
            exit 1
          fi

          # Collect diff limited to relevant files
          DIFF=$(git diff --unified=3 ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} -- $(cat changed_files.txt))

          # Truncate extremely large diffs to stay within context limits
          DIFF_LENGTH=${#DIFF}
          if [ "$DIFF_LENGTH" -gt 120000 ]; then
            DIFF="${DIFF:0:120000}\n\n... [diff truncated for length]"
          fi

          # Professional system prompt tailored for business/marketing JS websites
          SYSTEM_PROMPT='You are a senior JavaScript/TypeScript code reviewer for a professional business and marketing website platform (Point Goddess CC).

Review the provided pull request diff with these priorities (in order):
1. Security – no secrets, no XSS/injection risks, safe handling of user input, secure API usage.
2. Code quality & TypeScript – proper types, clean ES modules, no unnecessary any, modern patterns.
3. Documentation – every exported function/component should have clear JSDoc comments explaining purpose, params, and return values.
4. Accessibility & marketing UX – semantic HTML, aria attributes when needed, conversion-friendly patterns, responsive considerations.
5. Performance & maintainability – avoid heavy client-side work, prefer server components where appropriate, readable structure.

Output format (strict markdown):
## OpenAI PR Review Summary
**Overall**: [PASS / NEEDS IMPROVEMENT / CRITICAL ISSUES]

### Findings
- **P0 (Critical)** – list any security or breaking issues (or "None")
- **P1 (Important)** – quality, missing docs, a11y, or maintainability issues
- **P2 (Suggestions)** – nice-to-have improvements

### Positive Notes
- Brief praise for good patterns or documentation

### Recommended Next Steps
- 2–4 concrete, actionable bullets the author can follow

Keep the entire response under 800 words. Be direct, professional, and constructive. Never invent issues that are not present in the diff.'

          # Build the user message
          USER_CONTENT=$(cat <<EOF
Pull Request #${{ github.event.pull_request.number }}
Repository: ${{ github.repository }}
Title: ${{ github.event.pull_request.title }}

Changed files:
$(cat changed_files.txt)

Diff:
```diff
$DIFF
```
EOF
)

          # Call OpenAI Chat Completions API
          RESPONSE=$(curl -sS https://api.openai.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d "$(jq -n \
              --arg system "$SYSTEM_PROMPT" \
              --arg user "$USER_CONTENT" \
              '{ 
                model: "gpt-4o-mini",
                temperature: 0.2,
                max_tokens: 1200,
                messages: [
                  {role: "system", content: $system},
                  {role: "user", content: $user}
                ]
              }')")

          # Extract the assistant message safely
          REVIEW_BODY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')

          if [ -z "$REVIEW_BODY" ] || [ "$REVIEW_BODY" = "null" ]; then
            echo "OpenAI returned an empty response. Full API reply:"
            echo "$RESPONSE"
            exit 1
          fi

          # Store for the next step (multiline safe)
          {
            echo "body<<EOF"
            echo "$REVIEW_BODY"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Post review comment on PR
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_BODY: ${{ steps.review.outputs.body }}
        run: |
          # Add a clear header so the comment is easy to identify
          FULL_COMMENT=$(cat <<EOF
## 🤖 OpenAI Automated Review
*Generated for business & marketing JavaScript/TypeScript changes*

$REVIEW_BODY

---
*This is an automated review. Human approval is still required before merging.*
EOF
)

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
            -f body="$FULL_COMMENT"

          echo "Review comment posted successfully."
